[package]
name = "symbolica-amflow"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
description = "RustFlow: Symbolica-native auxiliary mass flow and physical kinematic transport"
license = "MIT"

[features]
default = ["native", "automatic"]
native = ["symbolica/integer-gmp", "symbolica/float-mpfr", "dep:rug", "rustred?/native", "feynkit-amplitude/native", "feynkit-generator/native", "feynkit-py?/native"]
automatic = ["dep:rustred", "dep:rayon"]
wasm = ["symbolica/wasm", "rustred?/wasm", "feynkit-amplitude/wasm", "feynkit-generator/wasm", "feynkit-py?/wasm"]
python_api = ["dep:pyo3", "dep:feynkit-py", "symbolica/python_export"]
# Preserve the existing full native Python feature and add a browser entry.
python = ["python_api", "native", "automatic"]
python_wasm = ["python_api", "wasm", "automatic"]
python_stubgen = ["python", "dep:pyo3-stub-gen", "symbolica/python_stubgen", "feynkit-py/python_stubgen"]

[[bin]]
name = "rustflow"
path = "src/bin/rustflow.rs"
required-features = ["automatic"]

[dependencies]
symbolica = { version = "=3.0.1", default-features = false, features = ["bincode", "serde", "tracing_max_level_info"] }
rustred = { git = "https://github.com/alphal00p/rustred", branch = "main", default-features = false, optional = true }
rug = { version = "1.28", default-features = false, features = ["float", "integer", "rational"], optional = true }
rayon = { version = "1.11", optional = true }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1"
ahash = "0.8"
bincode = { version = "2.0.1", features = ["serde"] }

# Match the host source identities; Cargo.lock pins standalone builds.
# Required owner-level HEPKit fixes: docs/hepkit-integration.md.
feynkit-amplitude = { git = "https://github.com/alphal00p/gammaloop", branch = "feynkit", default-features = false }
feynkit-generator = { git = "https://github.com/alphal00p/gammaloop", branch = "feynkit", default-features = false }
feynkit-graph = { git = "https://github.com/alphal00p/gammaloop", branch = "feynkit", default-features = false }
feynkit-model = { git = "https://github.com/alphal00p/gammaloop", branch = "feynkit", default-features = false }
feynkit-kinematics = { git = "https://github.com/alphal00p/gammaloop", branch = "feynkit", default-features = false }
feynkit-tensor = { git = "https://github.com/alphal00p/gammaloop", branch = "feynkit", default-features = false }
linnet = { git = "https://github.com/alphal00p/gammaloop", branch = "feynkit", default-features = false, features = ["serde", "bincode", "nodestore-vec"] }
spenso = { git = "https://github.com/alphal00p/gammaloop", branch = "feynkit", default-features = false, features = ["shadowing"] }
idenso = { git = "https://github.com/alphal00p/gammaloop", branch = "feynkit", default-features = false }

pyo3 = { version = "0.28", optional = true, features = ["multiple-pymethods"] }
feynkit-py = { git = "https://github.com/alphal00p/gammaloop", branch = "feynkit", optional = true, default-features = false }
pyo3-stub-gen = { version = "0.17", optional = true, default-features = false, features = ["infer_signature"] }

[build-dependencies]
blake3 = "1"
serde_json = "1"

# Standalone default; an embedding workspace owns its own patch table.
# The community revision retains the scale-independent root-convergence fix.
[patch.crates-io]
# The native HEPKit renderer uses its maintained lean Typst components.
typst-library = { git = "https://github.com/alphal00p/gammaloop", branch = "feynkit" }
typst-svg = { git = "https://github.com/alphal00p/gammaloop", branch = "feynkit" }
# Current tensor zero checks and shared evaluator composition (Symbolica PR #99).
symbolica = { git = "https://github.com/symbolica-dev/symbolica", branch = "codex/community-evaluator-composition" }
numerica = { git = "https://github.com/symbolica-dev/symbolica", branch = "codex/community-evaluator-composition" }
graphica = { git = "https://github.com/symbolica-dev/symbolica", branch = "codex/community-evaluator-composition" }

symbolica-typst-plugin = { git = "https://github.com/symbolica-dev/symbolica-typst-plugin", rev = "57b7455b37c30f4f87353c0073e49f5225e937ab" }

[profile.dev.package."*"]
opt-level = 2

[profile.release]
debug = 1
